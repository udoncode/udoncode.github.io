.sg rect,.bt .z{animation:tw 1.6s steps(2) infinite}

</sc-for>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all', subs: [], tags: [], page: 1, now: Date.now() };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  data() {
    if (this._d) return this._d;
    const cats = [
      { id: 'dev', name: '개발', subs: [['fe', '프론트엔드', 9], ['be', '백엔드', 8], ['tool', '도구', 5]] },
      { id: 'hobby', name: '취미', subs: [['food', '음식', 7], ['movie', '영화', 6], ['game', '게임', 6]] },
      { id: 'life', name: '일상', subs: [['trip', '여행', 5], ['note', '기록', 4]] }
    ];
    const pool = {
      fe: ['svelte', 'sveltekit', 'tailwind', 'css', 'typescript'],
      be: ['spring', 'jpa', 'mysql', 'docker', 'security'],
      tool: ['git', 'github', 'claude', 'vscode'],
      food: ['카페', '라멘', '베이킹', '맛집'],
      movie: ['SF', '다큐', '애니', '리뷰'],
      game: ['레트로', '인디', '퍼즐', '리뷰'],
      trip: ['서울', '제주', '일본', '기차'],
      note: ['회고', '독서', '메모']
    };
    const flat = [];
    cats.forEach((c) => c.subs.forEach((s) => flat.push({ cat: c.id, catName: c.name, sub: s[0], subName: s[1], n: s[2], i: 0 })));
    const posts = [];
    let left = true;
    while (left) {
      left = false;
      flat.forEach((f) => {
        if (f.i < f.n) {
          left = true; f.i += 1;
          const id = posts.length, d = new Date(2026, 10, 8 - (id * 2 + (id % 3)));
          const p2 = (x) => String(x).padStart(2, '0');
          const pl = pool[f.sub], k = 1 + (id % 3 === 0 ? 1 : 0) + (id % 4 === 0 ? 1 : 0), tags = [];
          for (let j = 0; j < k; j++) tags.push(pl[(id + j) % pl.length]);
          posts.push({
            id, cat: f.cat, sub: f.sub, catName: f.catName, subName: f.subName, tags,
            title: '[' + f.subName + '] 샘플 글 제목 ' + p2(f.i) + (id % 3 === 0 ? ' — 제목이 길어지면 마우스를 올렸을 때 이렇게 흘러가며 끝까지 보여줘요' : ''),
            date: d.getFullYear() + '.' + p2(d.getMonth() + 1) + '.' + p2(d.getDate())
          });
        }
      });
    }
    this._d = { cats, posts };
    return this._d;
  }
  renderVals() {
    const PER = 8, p2 = (x) => String(x).padStart(2, '0');
    const st = Object.assign({ cat: 'all', subs: [], tags: [], page: 1, now: Date.now() }, this.state || {});
    const { cats, posts } = this.data();
    const inCat = posts.filter((p) => st.cat === 'all' || (p.cat === st.cat && (st.subs.length === 0 || st.subs.indexOf(p.sub) >= 0)));
    const filtered = inCat.filter((p) => st.tags.length === 0 || p.tags.some((t) => st.tags.indexOf(t) >= 0));
    const total = Math.max(1, Math.ceil(filtered.length / PER)), page = Math.min(st.page, total);
    const items = filtered.slice((page - 1) * PER, page * PER);
    const rows = items.map((p, i) => ({ no: p2((page - 1) * PER + i + 1), title: p.title, date: p.date }));
    const catList = [{ id: 'all', name: '전체', count: p2(posts.length), subs: [] }].concat(cats.map((c) => ({ id: c.id, name: c.name, subs: c.subs, count: p2(posts.filter((p) => p.cat === c.id).length) })));
    const reset = { page: 1, tags: [] };
    const catRows = catList.map((c) => {
      const open = st.cat === c.id && c.id !== 'all';
      const subRows = open ? [{ id: 'all', name: '전체', count: c.count, on: st.subs.length === 0 ? 'on' : '', tree: '├─', pick: () => this.setState(Object.assign({ subs: [] }, reset)) }].concat(c.subs.map((s, i) => ({
        id: s[0], name: s[1], tree: i === c.subs.length - 1 ? '└─' : '├─',
        count: p2(posts.filter((p) => p.sub === s[0]).length),
        on: st.subs.indexOf(s[0]) >= 0 ? 'on' : '',
        pick: () => { const has = st.subs.indexOf(s[0]) >= 0; this.setState(Object.assign({ subs: has ? st.subs.filter((x) => x !== s[0]) : st.subs.concat(s[0]) }, reset)); }
      }))) : [];
      return { id: c.id, name: c.name, count: c.count, on: st.cat === c.id ? 'on' : '', open, subs: subRows, pick: () => this.setState(Object.assign({ cat: c.id, subs: [] }, reset)) };
    });
    const tc = {};
    inCat.forEach((p) => p.tags.forEach((t) => { tc[t] = (tc[t] || 0) + 1; }));
    const tagRows = Object.keys(tc).sort((a, b) => tc[b] - tc[a] || (a < b ? -1 : 1)).map((t) => {
      const on = st.tags.indexOf(t) >= 0;
      return { name: t, count: p2(tc[t]), on: on ? 'on' : '', pressed: on, pick: () => this.setState({ tags: on ? st.tags.filter((x) => x !== t) : st.tags.concat(t), page: 1 }) };
    });
    const start = Math.max(1, Math.min(page - 2, total - 4));
    const nums = [0, 1, 2, 3, 4].map((k) => { const n = start + k; return { label: n, on: n === page ? 'on' : '', dis: n > total, pick: () => this.setState({ page: n }) }; });
    const go = (n) => this.setState({ page: Math.max(1, Math.min(total, n)) });
    const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
    const o = {};
    f.formatToParts(new Date(st.now)).forEach((x) => { o[x.type] = x.value; });
    return {
      catRows, rows, nums, tagRows, empty: filtered.length === 0,
      tagSel: st.tags.length ? p2(st.tags.length) + ' SELECTED' : '', noTagSel: st.tags.length === 0, clearTags: () => this.setState({ tags: [], page: 1 }),
      prev: () => go(page - 1), next: () => go(page + 1), prevDis: page <= 1, nextDis: page >= total,
      pageText: page + '/' + total, gauge: Math.round(page / total * 100) + '%',
      clock: 'Seoul, South Korea ' + o.year + '-' + o.month + '-' + o.day + ' ' + o.hour + ':' + o.minute + ':' + o.second + ' (KST)'
    };
  }
}
